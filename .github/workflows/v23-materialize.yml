name: V2.3 materialize source
on:
  push:
    branches: [v2.3-compact-shell-pro]
permissions:
  contents: write
concurrency:
  group: v23-materialize
  cancel-in-progress: false
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[v23-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Materialize verified V2.3 source
        shell: bash
        run: |
          set -euo pipefail
          cat .v23-payload/part* > /tmp/v23.b64
          base64 -d /tmp/v23.b64 > /tmp/v23_patch.tar.xz
          echo "7293ed0114e40b3ae6013b613a6fe2f3d0ecb66282491aec2a448e3e27bceb2d  /tmp/v23_patch.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v23_patch.tar.xz -C .
          rm -f reference/legacy-trainer/leetcodedataeng-main.zip
          rm -rf .v23-payload
          rm -f .github/workflows/v23-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Materialize CodeDELeet V2.3 compact shell [v23-materialized]"
          git push origin HEAD:v2.3-compact-shell-pro
