name: V2 checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/fixture_check.py
      - run: python -m playwright install --with-deps chromium
      - name: Built-file browser interactions
        run: python tests/ui_smoke.py

  runtime-smoke:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Validate committed static release over HTTP
        run: |
          node scripts/serve.mjs dist > /tmp/codedeleet-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          python scripts/validate_release.py
      - name: Rebuild source candidate
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run build
      - name: Served-origin UI smoke
        env:
          UI_MODE: http
        run: python tests/ui_smoke.py
      - name: Real DuckDB, Pyodide, persistence and Mermaid smoke
        run: python tests/network_runtime_smoke.py
