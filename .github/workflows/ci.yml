name: V2 checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/fixture_check.py
      - run: python -m playwright install --with-deps chromium
      - name: Built-file browser interactions
        run: python tests/ui_smoke.py
# No deployment and no write permission. External-runtime/HTTP-origin promotion
# gates are deliberately separate until the first real hosted validation.
