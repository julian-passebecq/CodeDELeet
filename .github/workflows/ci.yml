name: V2.2 checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - name: Audit locked npm dependencies
        run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/fixture_check.py
      - run: python -m playwright install --with-deps chromium
      - name: Built-file browser regressions
        run: python tests/ui_smoke.py
      - name: V2.2 shell and isolated cases
        run: python tests/v22_ui.py
      - name: Contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-contract-evidence
          path: evidence/
  runtime-smoke:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Validate committed static release over HTTP
        run: |
          node scripts/serve.mjs dist > /tmp/codedeleet-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          python scripts/validate_release.py
      - name: Rebuild source candidate
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run build
          git diff --exit-code -- dist public/app
      - name: Served-origin UI smoke
        env:
          UI_MODE: http
        run: python tests/ui_smoke.py
      - name: Served-origin shell and case smoke
        env:
          UI_MODE: http
        run: python tests/v22_ui.py
      - name: Real DuckDB, Pyodide, persistence and Mermaid
        run: python tests/network_runtime_smoke.py
      - name: Runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-runtime-evidence
          path: |
            evidence/
            /tmp/codedeleet-server.log
  netlify-preview:
    if: github.event_name == 'pull_request'
    needs: runtime-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--leetdejul.netlify.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Verify deployed build and security headers
        run: python scripts/verify_hosted.py
      - name: Full deployed workstation smoke
        env:
          UI_MODE: http
        run: |
          python tests/ui_smoke.py
          python tests/v22_ui.py
      - name: Real deployed SQL, Python, worker restart and diagrams
        run: python tests/network_runtime_smoke.py
      - name: Hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-netlify-preview-evidence
          path: evidence/
