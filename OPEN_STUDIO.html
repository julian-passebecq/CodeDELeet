const __resources={"./packs/index.json":"{\n  \"schemaVersion\": 1,\n  \"packs\": [\n    \"./packs/starter.json\"\n  ]\n}","./packs/starter.json":"{\n  \"schemaVersion\": 1,\n  \"id\": \"studio-starter\",\n  \"title\": \"Data engineering foundations\",\n  \"version\": 1,\n  \"questions\": [\n    {\n      \"id\": \"sql-paid-revenue\",\n      \"version\": 1,\n      \"title\": \"Revenue without losing customers\",\n      \"workspace\": \"code\",\n      \"topic\": \"SQL\",\n      \"difficulty\": \"Easy\",\n      \"minutes\": 12,\n      \"engine\": \"sql\",\n      \"language\": \"SQL\",\n      \"summary\": \"LEFT JOIN, conditional aggregation and a zero-revenue customer.\",\n      \"concept\": [\n        \"The grain of the output is one row per customer. A LEFT JOIN preserves a customer even when no order matches.\",\n        \"A filter in WHERE can remove the null-extended rows from a LEFT JOIN. Put the paid-status condition inside the join or inside a conditional SUM.\"\n      ],\n      \"task\": \"Return customer_id, name and revenue for every customer. Sum only orders with status paid. Customers with no paid orders must have revenue 0. Sort by customer_id.\",\n      \"requirements\": [\n        \"Keep all customers, including customers without orders.\",\n        \"Exclude cancelled and pending orders.\",\n        \"Use the exact column names customer_id, name, revenue.\"\n      ],\n      \"starter\": \"SELECT c.customer_id, c.name,\\n       -- Your aggregate here\\n       0 AS revenue\\nFROM customers AS c\\nORDER BY c.customer_id;\",\n      \"solution\": \"SELECT c.customer_id, c.name,\\n       COALESCE(SUM(o.amount), 0) AS revenue\\nFROM customers AS c\\nLEFT JOIN orders AS o\\n  ON c.customer_id = o.customer_id\\n AND o.status = 'paid'\\nGROUP BY c.customer_id, c.name\\nORDER BY c.customer_id;\",\n      \"explanation\": \"Filter the right-hand table inside ON. An unmatched customer still exists in the result, and COALESCE converts their null sum into zero. Tests also include empty orders and repeated amounts.\",\n      \"hints\": [\n        \"Start with customers, not orders.\",\n        \"A filter inside ON and one in WHERE do not have the same effect on a LEFT JOIN.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"DuckDB SQL documentation\",\n          \"url\": \"https://duckdb.org/docs/stable/sql/introduction\"\n        }\n      ],\n      \"dataset\": \"retail\",\n      \"ordered\": true\n    },\n    {\n      \"id\": \"sql-latest-order\",\n      \"version\": 1,\n      \"title\": \"The latest order, with a tie-breaker\",\n      \"workspace\": \"code\",\n      \"topic\": \"SQL\",\n      \"difficulty\": \"Medium\",\n      \"minutes\": 12,\n      \"engine\": \"sql\",\n      \"language\": \"SQL\",\n      \"summary\": \"Use a window function to keep one deterministic row per customer.\",\n      \"concept\": [\n        \"ROW_NUMBER numbers rows within each partition. The window ORDER BY decides which row comes first.\",\n        \"A timestamp alone is not deterministic when two rows share it. Add a stable tie-breaker.\"\n      ],\n      \"task\": \"For each customer with an order, return customer_id, order_id and order_date for the latest order. Break same-date ties with the greatest order_id. Sort by customer_id.\",\n      \"requirements\": [\n        \"One row per customer with an order.\",\n        \"Use descending order_date and then descending order_id.\",\n        \"No rows for customers with no orders.\"\n      ],\n      \"starter\": \"WITH ranked AS (\\n  SELECT *,\\n         ROW_NUMBER() OVER (\\n           PARTITION BY customer_id\\n           ORDER BY order_date DESC\\n         ) AS rn\\n  FROM orders\\n)\\nSELECT customer_id, order_id, order_date\\nFROM ranked\\nWHERE rn = 1\\nORDER BY customer_id;\",\n      \"solution\": \"WITH ranked AS (\\n  SELECT *, ROW_NUMBER() OVER (\\n    PARTITION BY customer_id\\n    ORDER BY order_date DESC, order_id DESC\\n  ) AS rn\\n  FROM orders\\n)\\nSELECT customer_id, order_id, order_date\\nFROM ranked\\nWHERE rn = 1\\nORDER BY customer_id;\",\n      \"explanation\": \"The extra order_id sort resolves ties explicitly. A grouped MAX(order_date) cannot by itself choose the other columns from that same row.\",\n      \"hints\": [\n        \"There is already one missing detail in the starter query.\",\n        \"Imagine two orders made on the same day.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"DuckDB SQL documentation\",\n          \"url\": \"https://duckdb.org/docs/stable/sql/introduction\"\n        }\n      ],\n      \"dataset\": \"retail\",\n      \"ordered\": true\n    },\n    {\n      \"id\": \"python-aggregate\",\n      \"version\": 1,\n      \"title\": \"Turn event rows into a dictionary\",\n      \"workspace\": \"code\",\n      \"topic\": \"Python\",\n      \"difficulty\": \"Easy\",\n      \"minutes\": 12,\n      \"engine\": \"python\",\n      \"language\": \"Python\",\n      \"summary\": \"Practice loops, dictionaries and a practical aggregation.\",\n      \"concept\": [\n        \"A dictionary maps a key to a value. A running total is a useful first data-engineering algorithm.\",\n        \"Using dict.get(key, 0) gives a starting value for a key that has not appeared before.\"\n      ],\n      \"task\": \"Implement solve(events). Each event has country and amount. Return a dictionary containing the sum of amounts for each country. Empty input must return {}.\",\n      \"requirements\": [\n        \"Do not mutate the input.\",\n        \"Include zero and negative amounts.\",\n        \"Use a simple loop; no external package is required.\"\n      ],\n      \"starter\": \"def solve(events):\\n    totals = {}\\n    for event in events:\\n        # Update the correct country\\n        pass\\n    return totals\",\n      \"solution\": \"def solve(events):\\n    totals = {}\\n    for event in events:\\n        key = event[\\\"country\\\"]\\n        totals[key] = totals.get(key, 0) + event[\\\"amount\\\"]\\n    return totals\",\n      \"explanation\": \"Each event is visited once: O(n) time. The dictionary stores one entry per distinct country: O(k) space.\",\n      \"hints\": [\n        \"Use the country as the dictionary key.\",\n        \"totals.get(key, 0) handles the first event for each country.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"Python tutorial: data structures\",\n          \"url\": \"https://docs.python.org/3/tutorial/datastructures.html\"\n        }\n      ],\n      \"entrypoint\": \"solve\",\n      \"pythonTests\": [\n        {\n          \"label\": \"Two countries\",\n          \"args\": [\n            [\n              {\n                \"country\": \"NO\",\n                \"amount\": 10\n              },\n              {\n                \"country\": \"SE\",\n                \"amount\": 5\n              },\n              {\n                \"country\": \"NO\",\n                \"amount\": 7\n              }\n            ]\n          ],\n          \"expected\": {\n            \"NO\": 17,\n            \"SE\": 5\n          }\n        },\n        {\n          \"label\": \"Empty input\",\n          \"args\": [\n            []\n          ],\n          \"expected\": {}\n        },\n        {\n          \"label\": \"Refund and zero\",\n          \"args\": [\n            [\n              {\n                \"country\": \"NO\",\n                \"amount\": 0\n              },\n              {\n                \"country\": \"NO\",\n                \"amount\": -2\n              }\n            ]\n          ],\n          \"expected\": {\n            \"NO\": -2\n          }\n        }\n      ]\n    },\n    {\n      \"id\": \"python-two-sum\",\n      \"version\": 1,\n      \"title\": \"Find the matching pair\",\n      \"workspace\": \"code\",\n      \"topic\": \"Python algorithms\",\n      \"difficulty\": \"Easy\",\n      \"minutes\": 12,\n      \"engine\": \"python\",\n      \"language\": \"Python\",\n      \"summary\": \"A classic hash-map algorithm, without unnecessary complexity.\",\n      \"concept\": [\n        \"A hash map lets you remember numbers seen previously. For the current number x, the missing value is target - x.\",\n        \"Checking before inserting prevents using the same element twice.\"\n      ],\n      \"task\": \"Implement solve(numbers, target). Return the two zero-based indices in increasing order when a pair exists, otherwise return []. The fixtures have at most one valid pair.\",\n      \"requirements\": [\n        \"Do not reuse an index.\",\n        \"Handle duplicate values and negative numbers.\",\n        \"Aim for one pass.\"\n      ],\n      \"starter\": \"def solve(numbers, target):\\n    seen = {}\\n    for index, value in enumerate(numbers):\\n        # Look for the complement\\n        pass\\n    return []\",\n      \"solution\": \"def solve(numbers, target):\\n    seen = {}\\n    for index, value in enumerate(numbers):\\n        other = target - value\\n        if other in seen:\\n            return [seen[other], index]\\n        seen[value] = index\\n    return []\",\n      \"explanation\": \"Expected O(n) time and O(n) extra space for a hash map. A nested loop would need O(n squared) comparisons in the worst case.\",\n      \"hints\": [\n        \"What value must accompany the current value?\",\n        \"Store the index, not only whether a value exists.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"Python tutorial: data structures\",\n          \"url\": \"https://docs.python.org/3/tutorial/datastructures.html\"\n        }\n      ],\n      \"entrypoint\": \"solve\",\n      \"pythonTests\": [\n        {\n          \"label\": \"Basic pair\",\n          \"args\": [\n            [\n              2,\n              7,\n              11,\n              15\n            ],\n            9\n          ],\n          \"expected\": [\n            0,\n            1\n          ]\n        },\n        {\n          \"label\": \"Duplicate numbers\",\n          \"args\": [\n            [\n              3,\n              3\n            ],\n            6\n          ],\n          \"expected\": [\n            0,\n            1\n          ]\n        },\n        {\n          \"label\": \"Negative values\",\n          \"args\": [\n            [\n              -2,\n              5,\n              3\n            ],\n            1\n          ],\n          \"expected\": [\n            0,\n            2\n          ]\n        },\n        {\n          \"label\": \"No match\",\n          \"args\": [\n            [\n              1,\n              2\n            ],\n            10\n          ],\n          \"expected\": []\n        }\n      ]\n    },\n    {\n      \"id\": \"spark-dedup\",\n      \"version\": 1,\n      \"title\": \"Deduplicate events deterministically\",\n      \"workspace\": \"code\",\n      \"topic\": \"PySpark\",\n      \"difficulty\": \"Medium\",\n      \"minutes\": 12,\n      \"engine\": \"review\",\n      \"language\": \"PySpark\",\n      \"summary\": \"Write a window transformation; reason about rows before running Spark.\",\n      \"concept\": [\n        \"dropDuplicates on a key does not express which row to retain. A window can define a latest-record rule.\",\n        \"A Spark transformation builds a plan. An action triggers computation. This workspace does not run a Spark cluster.\"\n      ],\n      \"task\": \"Given events(customer_id, event_time, event_id), keep the latest row per customer. Break event_time ties with event_id. Explain why dropDuplicates([\\\"customer_id\\\"]) is insufficient.\",\n      \"requirements\": [\n        \"Partition by customer_id.\",\n        \"Sort both tie-breaker columns descending.\",\n        \"Remove the helper column after filtering.\"\n      ],\n      \"starter\": \"from pyspark.sql import functions as F, Window\\n\\nwindow = Window.partitionBy(\\\"customer_id\\\")\\n# Add ordering, row_number and the filter.\",\n      \"solution\": \"from pyspark.sql import functions as F, Window\\n\\nwindow = Window.partitionBy(\\\"customer_id\\\").orderBy(\\n    F.col(\\\"event_time\\\").desc(), F.col(\\\"event_id\\\").desc()\\n)\\nlatest = (events.withColumn(\\\"rn\\\", F.row_number().over(window))\\n          .filter(F.col(\\\"rn\\\") == 1)\\n          .drop(\\\"rn\\\"))\",\n      \"explanation\": \"The window records the business rule explicitly. The plan will generally redistribute and sort data by the window key. Export the code to an actual Spark environment to validate runtime behavior.\",\n      \"hints\": [\n        \"Reuse the idea from the SQL ROW_NUMBER exercise.\",\n        \"A DataFrame has no implicit reliable row order.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"Spark DataFrame API\",\n          \"url\": \"https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/dataframe.html\"\n        }\n      ],\n      \"rubric\": [\n        \"The partition key is customer_id.\",\n        \"Both tie-breakers are descending.\",\n        \"Only rn = 1 is kept.\",\n        \"I can explain why unordered deduplication is not enough.\"\n      ]\n    },\n    {\n      \"id\": \"tsql-running-total\",\n      \"version\": 1,\n      \"title\": \"A running total in T-SQL\",\n      \"workspace\": \"code\",\n      \"topic\": \"T-SQL\",\n      \"difficulty\": \"Medium\",\n      \"minutes\": 12,\n      \"engine\": \"review\",\n      \"language\": \"T-SQL\",\n      \"summary\": \"Understand ROWS versus RANGE with a concrete window frame.\",\n      \"concept\": [\n        \"A running total depends on partition, order and frame. ROWS is a physical-row frame.\",\n        \"Ordering only by a nonunique date can create peers. Include a stable key when you want a row-by-row total.\"\n      ],\n      \"task\": \"Write a T-SQL query returning order_id, customer_id and running_amount by customer, ordered by order_date then order_id. Use an explicit ROWS frame.\",\n      \"requirements\": [\n        \"Partition by customer_id.\",\n        \"Use ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW.\",\n        \"Discuss duplicate order dates.\"\n      ],\n      \"starter\": \"SELECT order_id, customer_id,\\n       SUM(amount) OVER (\\n         PARTITION BY customer_id\\n         -- Ordering and frame\\n       ) AS running_amount\\nFROM orders;\",\n      \"solution\": \"SELECT order_id, customer_id,\\n       SUM(amount) OVER (\\n         PARTITION BY customer_id\\n         ORDER BY order_date, order_id\\n         ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\\n       ) AS running_amount\\nFROM orders;\",\n      \"explanation\": \"The frame includes prior rows plus the current row in the declared order. This is T-SQL review, not SQL Server execution; the app does not silently translate it into DuckDB.\",\n      \"hints\": [\n        \"The order inside OVER is distinct from the final display order.\",\n        \"Add order_id to break date ties.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"DuckDB SQL documentation\",\n          \"url\": \"https://duckdb.org/docs/stable/sql/introduction\"\n        }\n      ],\n      \"rubric\": [\n        \"Correct partition.\",\n        \"Stable ordering.\",\n        \"Explicit ROWS frame.\",\n        \"I distinguish a frame from a partition.\"\n      ]\n    },\n    {\n      \"id\": \"bigquery-qualify\",\n      \"version\": 1,\n      \"title\": \"Latest events with QUALIFY\",\n      \"workspace\": \"code\",\n      \"topic\": \"BigQuery SQL\",\n      \"difficulty\": \"Medium\",\n      \"minutes\": 12,\n      \"engine\": \"review\",\n      \"language\": \"BigQuery SQL\",\n      \"summary\": \"Practice a GoogleSQL pattern without provisioning BigQuery.\",\n      \"concept\": [\n        \"QUALIFY filters after window calculations in GoogleSQL.\",\n        \"A partition filter can reduce scanned data, but filtering history before deduplication can change the business meaning of latest.\"\n      ],\n      \"task\": \"Select the latest event for every customer from analytics.events using QUALIFY. Use event_time DESC and event_id DESC. Explain the scope of any time filter you introduce.\",\n      \"requirements\": [\n        \"Use ROW_NUMBER and QUALIFY.\",\n        \"State whether latest means all time or inside a date range.\"\n      ],\n      \"starter\": \"SELECT *\\nFROM `analytics.events`\\nQUALIFY -- Window condition\",\n      \"solution\": \"SELECT *\\nFROM `analytics.events`\\nQUALIFY ROW_NUMBER() OVER (\\n  PARTITION BY customer_id\\n  ORDER BY event_time DESC, event_id DESC\\n) = 1;\",\n      \"explanation\": \"QUALIFY avoids a wrapper query for filtering the window result. A last-seven-days WHERE clause changes the candidate rows and must match the requirement.\",\n      \"hints\": [\n        \"The ROW_NUMBER expression can appear directly after QUALIFY.\",\n        \"Do not claim pruning without a suitable partition filter.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"BigQuery: query syntax\",\n          \"url\": \"https://cloud.google.com/bigquery/docs/reference/standard-sql/query-syntax\"\n        }\n      ],\n      \"rubric\": [\n        \"QUALIFY filters row_number = 1.\",\n        \"The order is deterministic.\",\n        \"I described the date-scope tradeoff.\"\n      ]\n    },\n    {\n      \"id\": \"pandas-grain\",\n      \"version\": 1,\n      \"title\": \"Group a DataFrame without losing its meaning\",\n      \"workspace\": \"code\",\n      \"topic\": \"pandas\",\n      \"difficulty\": \"Easy\",\n      \"minutes\": 12,\n      \"engine\": \"review\",\n      \"language\": \"Python / pandas\",\n      \"summary\": \"Groupby, named aggregation and output grain.\",\n      \"concept\": [\n        \"Aggregation changes the grain: line items become one row per group.\",\n        \"Named aggregation makes output column names explicit and reviewable.\"\n      ],\n      \"task\": \"Given a pandas DataFrame lines with customer_id and amount, return one row per customer with total_amount and line_count. Use as_index=False.\",\n      \"requirements\": [\n        \"Sum amount.\",\n        \"Count rows rather than only non-null amounts.\"\n      ],\n      \"starter\": \"summary = lines.groupby(\\\"customer_id\\\", as_index=False).agg(\\n    # Named aggregations\\n)\",\n      \"solution\": \"summary = lines.groupby(\\\"customer_id\\\", as_index=False).agg(\\n    total_amount=(\\\"amount\\\", \\\"sum\\\"),\\n    line_count=(\\\"amount\\\", \\\"size\\\")\\n)\",\n      \"explanation\": \"size counts rows, including rows whose amount is missing. count counts non-null values in the chosen column. Check null grouping-key behavior separately.\",\n      \"hints\": [\n        \"size and count differ on missing values.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"pandas: group by\",\n          \"url\": \"https://pandas.pydata.org/docs/user_guide/groupby.html\"\n        }\n      ],\n      \"rubric\": [\n        \"The output grain is customer.\",\n        \"I used size for row count.\",\n        \"I understand missing-value behavior.\"\n      ]\n    },\n    {\n      \"id\": \"git-safe-undo\",\n      \"version\": 1,\n      \"title\": \"Undo a shared commit safely\",\n      \"workspace\": \"code\",\n      \"topic\": \"Git\",\n      \"difficulty\": \"Easy\",\n      \"minutes\": 12,\n      \"engine\": \"review\",\n      \"language\": \"Shell\",\n      \"summary\": \"Choose revert rather than rewriting a shared history.\",\n      \"concept\": [\n        \"A commit records a snapshot and parent reference. Shared history is an agreement between collaborators.\",\n        \"git revert creates a new inverse commit; reset moves a reference and can rewrite local history.\"\n      ],\n      \"task\": \"Commit abc123 introduced a bug and has already been pushed to a shared branch. Write commands to inspect and safely undo it, then explain why a force push is not the default.\",\n      \"requirements\": [\n        \"Inspect status before making changes.\",\n        \"Use revert on the shared commit.\",\n        \"Do not execute a force push.\"\n      ],\n      \"starter\": \"git status\\n# Inspect and safely undo the shared commit\",\n      \"solution\": \"git status\\ngit show abc123\\ngit revert abc123\\ngit log --oneline -3\\n# Review, test, then push according to your team workflow.\",\n      \"explanation\": \"Revert preserves history and adds an explicit reversal. Conflicts may still need resolution. Commands here are text only; nothing touches a real repository.\",\n      \"hints\": [\n        \"The goal is a new commit, not removing an old one.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"Git book: undoing things\",\n          \"url\": \"https://git-scm.com/book/en/v2/Git-Basics-Undoing-Things\"\n        }\n      ],\n      \"rubric\": [\n        \"I inspect first.\",\n        \"I use revert.\",\n        \"I can distinguish revert, restore and reset.\"\n      ]\n    },\n    {\n      \"id\": \"linux-log-triage\",\n      \"version\": 1,\n      \"title\": \"Find failures in a pipeline log\",\n      \"workspace\": \"code\",\n      \"topic\": \"Linux\",\n      \"difficulty\": \"Easy\",\n      \"minutes\": 12,\n      \"engine\": \"review\",\n      \"language\": \"Shell\",\n      \"summary\": \"Build a readable, non-destructive log-inspection command.\",\n      \"concept\": [\n        \"Pipes send one command output to the next. Quoting prevents unintended shell interpretation.\",\n        \"Exit code 1 from grep means no match, which is not the same as an execution error.\"\n      ],\n      \"task\": \"Write a command that shows the last 20 case-insensitive occurrences of error in pipeline.log, with line numbers. Explain what happens when there are no matches.\",\n      \"requirements\": [\n        \"Keep the file unchanged.\",\n        \"Use case-insensitive matching and line numbers.\"\n      ],\n      \"starter\": \"# Show the last 20 matching log lines\",\n      \"solution\": \"grep -in 'error' pipeline.log | tail -n 20\",\n      \"explanation\": \"grep -i ignores case, -n prefixes line numbers, and tail chooses the last matches. In scripts, pipefail changes how the pipeline exit status is reported.\",\n      \"hints\": [\n        \"Filter before taking the last 20 matches.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"GNU grep manual\",\n          \"url\": \"https://www.gnu.org/software/grep/manual/grep.html\"\n        }\n      ],\n      \"rubric\": [\n        \"Correct flags and quoted pattern.\",\n        \"No destructive commands.\",\n        \"I can explain no-match exit status.\"\n      ]\n    },\n    {\n      \"id\": \"bi-star-schema\",\n      \"version\": 1,\n      \"title\": \"Design the sales star schema\",\n      \"workspace\": \"model\",\n      \"topic\": \"Data modeling\",\n      \"difficulty\": \"Easy\",\n      \"minutes\": 12,\n      \"engine\": \"graph\",\n      \"language\": \"Model design\",\n      \"summary\": \"Connect dimensions to a sales fact at a consistent grain.\",\n      \"concept\": [\n        \"The grain describes one row of the fact table. Define it before choosing relationships or measures.\",\n        \"The dimension key on the one side must be unique. A typical star filters from a dimension toward the fact.\"\n      ],\n      \"task\": \"Choose the grain of Sales and inspect the customer and product relationships. The sample Sales table contains one row per order line. Use the model check to find broken or missing relationships.\",\n      \"requirements\": [\n        \"Choose order line as the fact grain.\",\n        \"DimCustomer and DimProduct must each filter Sales.\",\n        \"Keep dimension keys unique.\"\n      ],\n      \"starter\": \"Model notes:\\n- Grain:\\n- Dimension keys:\\n- Filter direction:\",\n      \"solution\": \"Grain: one order line.\\nDimCustomer[CustomerKey] 1 -> * Sales[CustomerKey]\\nDimProduct[ProductKey] 1 -> * Sales[ProductKey]\\nUse single-direction filters from each dimension to Sales.\",\n      \"explanation\": \"An order can contain several lines. Joining two facts at different grains can multiply rows and overstate revenue. Keep the grain and filter direction visible when checking measures.\",\n      \"hints\": [\n        \"Read the SaleKey and OrderKey values in Data preview.\",\n        \"The fact key is a line key, not the order key.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"Microsoft: star schema guidance\",\n          \"url\": \"https://learn.microsoft.com/en-us/power-bi/guidance/star-schema\"\n        }\n      ],\n      \"template\": \"model\",\n      \"expectedGrain\": \"order-line\",\n      \"rubric\": [\n        \"I stated the fact grain.\",\n        \"Both dimension relationships are active.\",\n        \"I checked key uniqueness.\"\n      ]\n    },\n    {\n      \"id\": \"bi-revenue\",\n      \"version\": 1,\n      \"title\": \"Write a revenue measure\",\n      \"workspace\": \"model\",\n      \"topic\": \"Power BI / DAX\",\n      \"difficulty\": \"Easy\",\n      \"minutes\": 12,\n      \"engine\": \"dax-subset\",\n      \"language\": \"DAX\",\n      \"summary\": \"See the model, rows and KPI while writing a row iterator.\",\n      \"concept\": [\n        \"SUM adds values from one column. SUMX evaluates an expression for each row of a table and sums those results.\",\n        \"A measure responds to filter context. The preview uses only the explicit teaching subset listed beside the editor.\"\n      ],\n      \"task\": \"Write Revenue as quantity multiplied by unit price, summed across visible Sales rows. Change the country slicer and inspect how the active customer relationship changes the KPI.\",\n      \"requirements\": [\n        \"Use SUMX over Sales.\",\n        \"Multiply Quantity by UnitPrice.\",\n        \"Check both All countries and Norway.\"\n      ],\n      \"starter\": \"Revenue = SUM(Sales[UnitPrice])\",\n      \"solution\": \"Revenue = SUMX(Sales, Sales[Quantity] * Sales[UnitPrice])\",\n      \"explanation\": \"Summing unit prices ignores quantities. SUMX supplies a row context for the multiplication and the active dimension filters decide which sales rows are visible.\",\n      \"hints\": [\n        \"Use an iterator when the expression multiplies two columns.\",\n        \"The row expression is Sales[Quantity] * Sales[UnitPrice].\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"Microsoft: DAX reference\",\n          \"url\": \"https://learn.microsoft.com/en-us/dax/\"\n        },\n        {\n          \"label\": \"Microsoft: star schema guidance\",\n          \"url\": \"https://learn.microsoft.com/en-us/power-bi/guidance/star-schema\"\n        }\n      ],\n      \"template\": \"model\"\n    },\n    {\n      \"id\": \"bi-margin\",\n      \"version\": 1,\n      \"title\": \"Gross margin that handles zero revenue\",\n      \"workspace\": \"model\",\n      \"topic\": \"Power BI / DAX\",\n      \"difficulty\": \"Medium\",\n      \"minutes\": 12,\n      \"engine\": \"dax-subset\",\n      \"language\": \"DAX\",\n      \"summary\": \"Build a ratio safely and distinguish a ratio of sums from a mean of ratios.\",\n      \"concept\": [\n        \"Margin is total profit divided by total revenue, not the unweighted average of row margins.\",\n        \"DIVIDE returns blank by default when the denominator is zero.\"\n      ],\n      \"task\": \"Write Margin using the built-in [Gross Profit] and [Revenue] measures. Select Denmark, which has no fixture sales, to observe a blank instead of an exception.\",\n      \"requirements\": [\n        \"Use DIVIDE.\",\n        \"Do not average individual row percentages.\"\n      ],\n      \"starter\": \"Margin = [Gross Profit] / [Revenue]\",\n      \"solution\": \"Margin = DIVIDE([Gross Profit], [Revenue])\",\n      \"explanation\": \"Revenue is the sum of quantity times unit price. Gross Profit subtracts quantity times unit cost. The ratio uses the same current filter context for both measures.\",\n      \"hints\": [\n        \"The preview includes built-in Revenue, Cost and Gross Profit measures.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"Microsoft: DAX reference\",\n          \"url\": \"https://learn.microsoft.com/en-us/dax/\"\n        }\n      ],\n      \"template\": \"model\"\n    },\n    {\n      \"id\": \"bi-filter-context\",\n      \"version\": 1,\n      \"title\": \"Replace a country filter with CALCULATE\",\n      \"workspace\": \"model\",\n      \"topic\": \"Power BI / DAX\",\n      \"difficulty\": \"Medium\",\n      \"minutes\": 12,\n      \"engine\": \"dax-subset\",\n      \"language\": \"DAX\",\n      \"summary\": \"Understand filter replacement using a small, visible model.\",\n      \"concept\": [\n        \"CALCULATE evaluates an expression in modified filter context.\",\n        \"A simple same-column filter in CALCULATE replaces that column filter unless a modifier such as KEEPFILTERS changes the behavior. This teaching subset supports only simple equality filters.\"\n      ],\n      \"task\": \"Write Norway Revenue with CALCULATE and DimCustomer[Country] = \\\"Norway\\\". Set the country slicer to Sweden. Explain why the measure still returns Norway revenue when the customer relationship is active.\",\n      \"requirements\": [\n        \"Use CALCULATE around [Revenue].\",\n        \"Filter DimCustomer[Country].\",\n        \"Explain replacement versus intersection.\"\n      ],\n      \"starter\": \"Norway Revenue = CALCULATE(\\n    [Revenue]\\n    -- Add a country filter\\n)\",\n      \"solution\": \"Norway Revenue = CALCULATE(\\n    [Revenue],\\n    DimCustomer[Country] = \\\"Norway\\\"\\n)\",\n      \"explanation\": \"The measure replaces the current country filter with Norway, while unrelated filters such as product category remain. This is a limited model, not a general DAX engine.\",\n      \"hints\": [\n        \"The filter is on a dimension column.\",\n        \"The product-category slicer should still affect the result.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"Microsoft: DAX reference\",\n          \"url\": \"https://learn.microsoft.com/en-us/dax/\"\n        }\n      ],\n      \"template\": \"model\"\n    },\n    {\n      \"id\": \"bi-csharp\",\n      \"version\": 1,\n      \"title\": \"Organize measures with a C# script\",\n      \"workspace\": \"model\",\n      \"topic\": \"C# / Tabular Editor\",\n      \"difficulty\": \"Easy\",\n      \"minutes\": 12,\n      \"engine\": \"review\",\n      \"language\": \"C#\",\n      \"summary\": \"Practice model metadata automation without changing a real Power BI model.\",\n      \"concept\": [\n        \"Tabular Editor scripting can automate model metadata such as names, format strings and display folders.\",\n        \"Metadata changes are different from evaluating DAX. They require review before applying them to a real model.\"\n      ],\n      \"task\": \"Write a Tabular Editor 2 script that puts the selected measures in the Revenue display folder. Explain how you would review the selection and save a backup first.\",\n      \"requirements\": [\n        \"Iterate only selected measures.\",\n        \"Set DisplayFolder to Revenue.\",\n        \"Do not change every measure in the model.\"\n      ],\n      \"starter\": \"foreach (var measure in Selected.Measures)\\n{\\n    // Set the display folder\\n}\",\n      \"solution\": \"foreach (var measure in Selected.Measures)\\n{\\n    measure.DisplayFolder = \\\"Revenue\\\";\\n}\",\n      \"explanation\": \"Selected.Measures limits the scope. The browser does not execute .NET, connect to XMLA, or modify Power BI. Export this script and test on a copy in Tabular Editor.\",\n      \"hints\": [\n        \"Use Selected.Measures rather than Model.AllMeasures.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"Tabular Editor: advanced scripting\",\n          \"url\": \"https://docs.tabulareditor.com/te2/Advanced-Scripting.html\"\n        }\n      ],\n      \"template\": \"model\",\n      \"rubric\": [\n        \"The script scopes to selected measures.\",\n        \"The display folder is correct.\",\n        \"I would inspect changes on a copy.\"\n      ]\n    },\n    {\n      \"id\": \"bi-scd\",\n      \"version\": 1,\n      \"title\": \"Preserve customer history with SCD Type 2\",\n      \"workspace\": \"model\",\n      \"topic\": \"Data modeling\",\n      \"difficulty\": \"Medium\",\n      \"minutes\": 12,\n      \"engine\": \"review\",\n      \"language\": \"Model design\",\n      \"summary\": \"Reason about business keys, surrogate keys and effective dates.\",\n      \"concept\": [\n        \"A business key identifies the customer; a surrogate key can identify one version of that customer.\",\n        \"Type 2 history keeps old versions rather than overwriting them. Facts must resolve to the correct version.\"\n      ],\n      \"task\": \"A customer changes country. Describe a Type 2 dimension and the date-range lookup needed when loading Sales. Explain how historical revenue keeps the old country.\",\n      \"requirements\": [\n        \"Use a surrogate key per version.\",\n        \"Specify effective-from and effective-to bounds.\",\n        \"Define a rule for late-arriving facts.\"\n      ],\n      \"starter\": \"DimCustomerVersion\\n- CustomerVersionKey\\n- CustomerBusinessKey\\n- Country\\n# Add the validity fields and lookup rule\",\n      \"solution\": \"DimCustomerVersion(CustomerVersionKey, CustomerBusinessKey, Country, ValidFrom, ValidTo, IsCurrent).\\nResolve the fact using its event date:\\nValidFrom \u003c= event_date AND event_date \u003c ValidTo.\\nStore CustomerVersionKey on Sales. Use non-overlapping ranges and an explicit unknown-member policy.\",\n      \"explanation\": \"An exclusive upper bound makes adjacent versions unambiguous. A fact linked only to the current business-key row would reclassify historical revenue after a change.\",\n      \"hints\": [\n        \"Two customer versions share a business key but not a surrogate key.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"Microsoft: star schema guidance\",\n          \"url\": \"https://learn.microsoft.com/en-us/power-bi/guidance/star-schema\"\n        }\n      ],\n      \"template\": \"model\",\n      \"rubric\": [\n        \"Surrogate key per version.\",\n        \"Non-overlapping validity ranges.\",\n        \"Event-time lookup.\",\n        \"Explicit late-arrival policy.\"\n      ]\n    },\n    {\n      \"id\": \"dag-data-quality\",\n      \"version\": 1,\n      \"title\": \"Put quality checks before publication\",\n      \"workspace\": \"pipeline\",\n      \"topic\": \"Airflow\",\n      \"difficulty\": \"Easy\",\n      \"minutes\": 12,\n      \"engine\": \"graph\",\n      \"language\": \"Python / Airflow\",\n      \"summary\": \"Repair a dependency graph and follow a failed run.\",\n      \"concept\": [\n        \"A DAG describes dependencies, not just the visual left-to-right order.\",\n        \"Under an all-success rule, a failed task blocks dependent tasks. This simulator supports only this explicit simplified rule and one transient failure.\"\n      ],\n      \"task\": \"The publish task is incorrectly dependent on transform rather than quality. Remove that edge and connect quality to publish. Simulate the transient quality failure with zero retries, then allow one retry.\",\n      \"requirements\": [\n        \"Required chain: extract -> transform -> quality -> publish.\",\n        \"No cycles or direct bypass to publish.\",\n        \"Explain why a failed check must block publication.\"\n      ],\n      \"starter\": \"# Illustrative Airflow task dependencies\\nextract >> transform\\ntransform >> quality\\ntransform >> publish  # Fix the dependency\",\n      \"solution\": \"extract >> transform >> quality >> publish\",\n      \"explanation\": \"The graph editor, not this code textbox, is the simulator source of truth. A transient quality failure is recovered when the allowed retry count is at least one. This does not execute Airflow.\",\n      \"hints\": [\n        \"Remove the transform-to-publish edge.\",\n        \"Select quality and change allowed retries after the failed simulation.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"Apache Airflow: DAGs\",\n          \"url\": \"https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/dags.html\"\n        }\n      ],\n      \"template\": \"pipeline\",\n      \"rubric\": [\n        \"Publication depends on quality.\",\n        \"The graph has no cycle.\",\n        \"I inspected failure propagation and retries.\"\n      ]\n    },\n    {\n      \"id\": \"adf-watermark\",\n      \"version\": 1,\n      \"title\": \"Advance a watermark only after success\",\n      \"workspace\": \"pipeline\",\n      \"topic\": \"Azure Data Factory\",\n      \"difficulty\": \"Medium\",\n      \"minutes\": 12,\n      \"engine\": \"graph\",\n      \"language\": \"ADF design\",\n      \"summary\": \"Practice incremental ingestion and failure-safe control flow.\",\n      \"concept\": [\n        \"A watermark records an ingestion boundary. Updating it too early can permanently skip rows after a failure.\",\n        \"A robust flow captures a high watermark, copies a bounded interval, validates, then persists the new boundary after success.\"\n      ],\n      \"task\": \"Repair the graph so that persist_watermark follows validate, not copy. Describe the replay strategy when copying succeeds but persistence fails.\",\n      \"requirements\": [\n        \"Control order: read_watermark -> copy -> validate -> persist_watermark.\",\n        \"Persist only after successful validation.\",\n        \"Use an idempotent destination or deduplication on retry.\"\n      ],\n      \"starter\": \"{\\n  \\\"activity\\\": \\\"persist_watermark\\\",\\n  \\\"dependsOn\\\": [{ \\\"activity\\\": \\\"copy\\\", \\\"dependencyConditions\\\": [\\\"Succeeded\\\"] }]\\n}\",\n      \"solution\": \"{\\n  \\\"activity\\\": \\\"persist_watermark\\\",\\n  \\\"dependsOn\\\": [{ \\\"activity\\\": \\\"validate\\\", \\\"dependencyConditions\\\": [\\\"Succeeded\\\"] }]\\n}\",\n      \"explanation\": \"Replaying the same interval must not duplicate business records. A watermark alone does not guarantee exactly-once behavior. This is an ADF-style exercise, not an ADF JSON validator.\",\n      \"hints\": [\n        \"The success boundary should include validation, not only copying.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"Microsoft: pipelines and activities\",\n          \"url\": \"https://learn.microsoft.com/en-us/azure/data-factory/concepts-pipelines-activities\"\n        }\n      ],\n      \"template\": \"watermark\",\n      \"rubric\": [\n        \"Persist follows validation.\",\n        \"Replay is idempotent.\",\n        \"I described a bounded extraction interval.\"\n      ]\n    },\n    {\n      \"id\": \"dbt-lineage\",\n      \"version\": 1,\n      \"title\": \"Test the model before its consumer\",\n      \"workspace\": \"pipeline\",\n      \"topic\": \"dbt\",\n      \"difficulty\": \"Easy\",\n      \"minutes\": 12,\n      \"engine\": \"graph\",\n      \"language\": \"SQL / dbt\",\n      \"summary\": \"See model dependencies and quality gates without running dbt.\",\n      \"concept\": [\n        \"ref() records a model dependency and resolves a relation name during compilation.\",\n        \"A visual quality gate here is a teaching abstraction. Actual dbt build selection and indirect test selection should be verified in your project.\"\n      ],\n      \"task\": \"Repair the graph so the mart is downstream of quality. Write a model that aggregates amount by customer from stg_orders with ref(). Explain where uniqueness and not-null tests belong.\",\n      \"requirements\": [\n        \"Use ref(\\\"stg_orders\\\").\",\n        \"Declare the output grain as one customer.\",\n        \"Inspect the quality gate in the graph.\"\n      ],\n      \"starter\": \"SELECT customer_id, SUM(amount) AS revenue\\nFROM {{ ref(\\\"stg_orders\\\") }}\\nGROUP BY customer_id\",\n      \"solution\": \"SELECT customer_id, SUM(amount) AS revenue\\nFROM {{ ref(\\\"stg_orders\\\") }}\\nGROUP BY customer_id\\n-- Add not_null and unique tests on the customer key of the customer-grain mart.\",\n      \"explanation\": \"The graph simulator does not compile Jinja or execute dbt. It trains dependency reasoning. Actual incremental behavior depends on materialization, adapter and merge-key configuration.\",\n      \"hints\": [\n        \"A customer-grain mart should have one unique non-null customer key.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"dbt: incremental models\",\n          \"url\": \"https://docs.getdbt.com/docs/build/incremental-models\"\n        }\n      ],\n      \"template\": \"dbt\",\n      \"rubric\": [\n        \"The output grain is stated.\",\n        \"ref defines the model dependency.\",\n        \"The quality gate precedes publication.\"\n      ]\n    },\n    {\n      \"id\": \"dag-idempotency\",\n      \"version\": 1,\n      \"title\": \"Rerun a daily partition safely\",\n      \"workspace\": \"pipeline\",\n      \"topic\": \"Pipeline design\",\n      \"difficulty\": \"Medium\",\n      \"minutes\": 12,\n      \"engine\": \"review\",\n      \"language\": \"Python / pseudocode\",\n      \"summary\": \"Design a task so retries do not double your data.\",\n      \"concept\": [\n        \"An idempotent operation produces the same intended result when repeated for the same input.\",\n        \"A data interval is not necessarily the wall-clock time at which a task happens to run.\"\n      ],\n      \"task\": \"A daily sales task currently appends its whole day on every retry. Propose a partition-replacement or key-based merge strategy and explain how it supports a backfill.\",\n      \"requirements\": [\n        \"Use the explicit processing date or interval.\",\n        \"Avoid now() as the only partition selector.\",\n        \"Address partial failures.\"\n      ],\n      \"starter\": \"def load_sales(processing_date):\\n    # Read a bounded interval\\n    # Make the write retry-safe\\n    pass\",\n      \"solution\": \"Read the requested date interval. Write to staging, validate, then atomically replace that destination partition where supported. Alternatively MERGE on a stable business key after deduplicating the source. Retry the same interval without generating new business keys.\",\n      \"explanation\": \"Idempotency is a property of the complete read/write design. A retry count cannot make a non-idempotent append safe by itself.\",\n      \"hints\": [\n        \"What happens if the same day is processed twice?\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"Apache Airflow: DAGs\",\n          \"url\": \"https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/dags.html\"\n        },\n        {\n          \"label\": \"Microsoft: pipelines and activities\",\n          \"url\": \"https://learn.microsoft.com/en-us/azure/data-factory/concepts-pipelines-activities\"\n        }\n      ],\n      \"template\": \"pipeline\",\n      \"rubric\": [\n        \"Bounded interval.\",\n        \"Stable business key or atomic partition replacement.\",\n        \"Partial-failure recovery.\",\n        \"Backfill uses the same logic.\"\n      ]\n    },\n    {\n      \"id\": \"arch-fabric\",\n      \"version\": 1,\n      \"title\": \"Design a Fabric analytics path\",\n      \"workspace\": \"architecture\",\n      \"topic\": \"Microsoft Fabric\",\n      \"difficulty\": \"Easy\",\n      \"minutes\": 12,\n      \"engine\": \"graph\",\n      \"language\": \"Architecture\",\n      \"summary\": \"Choose a small ingestion-to-reporting design and explain each boundary.\",\n      \"concept\": [\n        \"Separate ingestion, refinement and business-ready consumption. Medallion names describe quality layers, not a requirement to triple all data.\",\n        \"A semantic model adds business relationships and measures; a report should not invent an inconsistent grain.\"\n      ],\n      \"task\": \"Create a source -> ingestion -> lakehouse -> semantic model -> report path. Explain refresh/freshness, access boundaries and a quality check before publishing the curated layer.\",\n      \"requirements\": [\n        \"Include ingestion, storage, semantic and report roles.\",\n        \"Connect the end-to-end data path.\",\n        \"Describe permissions and freshness.\"\n      ],\n      \"starter\": \"source[Operational source] -> ingest[Fabric pipeline]\\ningest -> store[OneLake lakehouse]\\nstore -> semantic[Semantic model]\\nsemantic -> report[Power BI report]\",\n      \"solution\": \"source[Operational source] -> ingest[Fabric pipeline]\\ningest -> store[OneLake lakehouse]\\nstore -> semantic[Semantic model]\\nsemantic -> report[Power BI report]\",\n      \"explanation\": \"This is a conceptual reference, not a production sizing recommendation. A structural check can find a disconnected report, but cannot prove licensing, security or freshness requirements are satisfied.\",\n      \"hints\": [\n        \"Start from the report requirement and work backwards.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"Microsoft: medallion lakehouse architecture\",\n          \"url\": \"https://learn.microsoft.com/en-us/fabric/onelake/onelake-medallion-lakehouse-architecture\"\n        },\n        {\n          \"label\": \"Microsoft: star schema guidance\",\n          \"url\": \"https://learn.microsoft.com/en-us/power-bi/guidance/star-schema\"\n        }\n      ],\n      \"template\": \"fabric\",\n      \"rubric\": [\n        \"Connected ingestion-to-report path.\",\n        \"Defined curated grain.\",\n        \"Quality checkpoint.\",\n        \"Refresh and access assumptions.\"\n      ]\n    },\n    {\n      \"id\": \"arch-databricks\",\n      \"version\": 1,\n      \"title\": \"A small medallion pipeline\",\n      \"workspace\": \"architecture\",\n      \"topic\": \"Databricks\",\n      \"difficulty\": \"Easy\",\n      \"minutes\": 12,\n      \"engine\": \"graph\",\n      \"language\": \"Architecture\",\n      \"summary\": \"Separate raw preservation, clean records and reporting aggregates.\",\n      \"concept\": [\n        \"Bronze preserves source-oriented data, silver refines and validates, and gold serves business needs.\",\n        \"The layers need explicit ownership, quality rules and a replay strategy. They are not merely folder names.\"\n      ],\n      \"task\": \"Draw source -> bronze -> silver -> gold -> report. State where schema checks, deduplication and customer-level revenue are produced.\",\n      \"requirements\": [\n        \"Preserve a replayable input.\",\n        \"Deduplicate at a defined business grain.\",\n        \"Do not label raw data as a reporting contract.\"\n      ],\n      \"starter\": \"source[Events] -> bronze[Bronze raw]\\nbronze -> silver[Silver validated]\\nsilver -> gold[Gold revenue]\\ngold -> report[BI consumer]\",\n      \"solution\": \"source[Events] -> bronze[Bronze raw]\\nbronze -> silver[Silver validated]\\nsilver -> gold[Gold revenue]\\ngold -> report[BI consumer]\",\n      \"explanation\": \"Keep the source replayable, deduplicate and validate before aggregating, and publish the gold contract at the requested grain. No Databricks workspace is created here.\",\n      \"hints\": [\n        \"Write one responsibility for every layer.\"\n      ],\n      \"sources\": [\n        {\n          \"label\": \"Databricks: medallion architecture\",\n          \"url\": \"https://docs.databricks.com/aws/en/lakehouse/medallion\"\n        }\n      ],\n      \"template\": \"databricks\",\n      \"rubric\": [\n        \"Raw replay strategy.\",\n        \"Deduplication grain.\",\n        \"Quality checks.\",\n        \"Gold consumer contract.\"\n      ]\n    },\n    {\n async function boot() {

        try {
            store = loadStore();
        }
        catch {
            bootWarning = 'Stored progress could not be read. It has not been overwritten. Export or inspect the original data before saving new work.';
            storageFailed = true;
            storageReadBlocked = true;
        }
        const [manifest, data] = await Promise.all([fetch('./packs/index.json').then(r => { if (!r.ok)
                throw new Error('Content-pack manifest is missing.'); return r.json(); }), fetch('./packs/fixtures.json').then(r => r.json())]);
        fixtures = data;
        if (manifest.schemaVersion !== 1 || !Array.isArray(manifest.packs))
            throw new Error('Invalid pack manifest.');
        for (const path of manifest.packs) {
            if (typeof path !== 'string' || !/^\.\/packs\/[A-Za-z0-9._/-]+\.json$/.test(path) || path.includes('..'))
                throw new Error('Unsafe manifest path.');
            builtins.push(validatePack(await fetch(path).then(r => r.json())));
        }
        const packIds = new Set(), qids = new Set();
        for (const pack of builtins) {
            if (packIds.has(pack.id))
                throw new Error('Duplicate built-in pack ID.');
            packIds.add(pack.id);
            for (const q of pack.questions) {
                if (qids.has(q.id))
                    throw new Error('Duplicate question ID in repository packs.');
                qids.add(q.id);
            }
        }
        let accepted = [];
        for (const p of store.customPacks)
            accepted = planPackImport(accepted, p, builtins).packs;
        store.customPacks = accepted;
        rebuildQuestions();
        render();
        if (bootWarning)
            toast(bootWarning, true);
        const health = await serverHealth();
        engine = health.engine;
        sqlAvailable = health.available;
        render();
    }
    catch (error) {
        app.innerHTML = `<div class="boot-error"><h1>The studio could not start.</h1><p>${e(error instanceof Error ? error.message : String(error))}</p><p>Use START_WINDOWS.bat or run <code>python server/app.py</code> from the extracted repository. Do not open index.html directly.</p><p>Your local progress has not been cleared.</p></div>`;
    }
}
async function execute(q, mode, tests = false) {
    if (busy.has(q.id))
        return;

        showModal('Enable real SQL locally', `<p>The static site has no SQL execution service. The learning UI still works.</p><p>Start the supplied launcher for a read-only local SQL adapter:</p><pre>python server/app.py</pre><p>It uses DuckDB when installed and otherwise clearly labeled SQLite. No cloud database is required.</p>`);
        return;
    }
    if (mode === 'python' && globalThis.__STUDIO_STANDALONE__) {
        showModal('Python in the local edition', `<p>This single-file edition supports study, graphs and DAX teaching previews without installation. Launch the full repository to enable optional browser Python, or export this code to your own notebook.</p><pre>python server/app.py --open</pre>`);
        return;
    }
    if (mode === 'python' && !store.settings.pyodideConsent) {
        showModal('Enable optional browser Python?', `<p>This downloads the pinned Pyodide runtime from jsDelivr. After loading, your basic Python solution runs inside a browser worker, not the local server.</p><p>Only run code you trust. A worker is not a security boundary for malicious network-aware code.</p>${UI.button('enable-and-run-python', 'Enable download & run', 'play', 'primary')}`);
        return;
    }
    busy.add(q.id);
    statuses.set(q.id, 'Running your solution...');
    render();
    try {
        const code = draft(q).code ?? q.starter;
        let result;
        if (mode === 'sql')
            result = await runSQL(code, q, tests);
        else if (mode === 'python')
            result = await runPython(q, code, status => { statuses.set(q.id, status); if (current()?.id === q.id)
                render(); });
        else {
            const start = performance.now();
            const d = draft(q), value = evaluateDax(code, fixtures, graph(q), { country: d.country ?? 'All', category: d.category ?? 'All' });
            result = { engine: 'DAX teaching subset (JavaScript, not Power BI)', columns: ['Measure', 'Value', 'Visible fixture rows'], rows: [[value.name, value.value, value.rowCount]], elapsedMs: Math.round(performance.now() - start) };
        }
        results.set(q.id, result);
        const passed = result.checks?.length ? result.checks.every(c => c.passed) : null;
        record(q, mode === 'dax' ? 'Teaching DAX preview' : result.engine, passed, result.checks?.length ? `${result.checks.filter(c => c.passed).length}/${result.checks.length} fixture checks passed.` : 'Output generated; not a correctness verdict.');
    }
    catch (error) {
        results.set(q.id, { engine: mode, columns: [], rows: [], elapsedMs: 0, error: error instanceof Error ? error.message : String(error) });
        record(q, `${mode} evaluation`, null, 'Evaluation unavailable or failed; no passing verdict.');
    }

        statuses.delete(q.id);
        render();
    }
}

        next = { ...clone(store), customPacks: plan.packs };
        summary = plan.summary;
    }
    else {
        next = mergeStores(store, validateStore(value), builtins);
        summary = `Merge this backup with current progress. Result: ${Object.keys(next.drafts).length} drafts and ${next.customPacks.length} custom packs. The newer timestamp wins for each draft. Device runtime consent stays unchanged.`;
    }
    lessonModal = false;
    showModal('Review the import', `<p>${e(summary)}</p>${UI.note('No changes have been made yet. Export a backup first to preserve both versions of any conflicting draft.')}<div class="settings-buttons">${UI.button('export-backup', 'Export current backup', 'download', 'secondary')}${UI.button('apply-import', 'Apply import', 'check', 'primary')}</div>`);

}
// Pointer dragging uses window listeners, so replacing the SVG during a drag is safe.
app.addEventListener('pointerdown', event => {
    const nodeEl = event.target.closest('[data-node]');

        return;
    const g = graph(q), node = g.nodes.find(n => n.id === nodeEl.dataset.node);
    if (!node)
        return;
    event.preventDefault();
    const svg = nodeEl.ownerSVGElement, rect = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    const initial = { x: node.x, y: node.y, px: event.clientX, py: event.clientY };
    selection.set(q.id, node.id);
    const move = (ev) => { node.x = Math.round(Math.max(8, Math.min(vb.width - 205, initial.x + (ev.clientX - initial.px) * vb.width / rect.width))); node.y = Math.round(Math.max(8, Math.min(vb.height - 90, initial.y + (ev.clientY - initial.py) * vb.height / rect.height))); const surface = document.getElementById('graph-surface'); if (surface)
        surface.innerHTML = graphSVG(g, node.id, Object.fromEntries((runs.get(q.id) ?? []).map(r => [r.id, r.status]))); };
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); patch(q, { graph: g }); render(); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up, { once: true });
});
